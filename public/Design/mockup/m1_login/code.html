<!DOCTYPE html>

<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;background-color:#ffffff;}body{overscroll-behavior:none;font-family:'Inter',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "error-container": "#ffdad6", "surface-container": "#f0eded", "primary": "#9d4300", "secondary-fixed-dim": "#ffb599", "on-tertiary-fixed-variant": "#4a463f", "on-tertiary-container": "#36322c", "inverse-on-surface": "#f3f0ef", "on-primary-container": "#582200", "tertiary": "#625e56", "on-secondary-fixed": "#370e00", "text-muted": "#6B7280", "on-secondary-fixed-variant": "#7f2b00", "on-surface-variant": "#584237", "on-secondary-container": "#571a00", "success": "#16A34A", "violet": "#7C3AED", "info": "#0284C7", "tertiary-fixed": "#e9e1d8", "danger": "#DC2626", "warning-bg": "#FFFBEB", "surface-bright": "#fcf9f8", "surface-white": "#FFFFFF", "on-tertiary": "#ffffff", "inverse-surface": "#303030", "on-background": "#1b1c1c", "on-primary-fixed": "#341100", "on-primary": "#ffffff", "on-surface": "#1b1c1c", "on-error": "#ffffff", "inverse-primary": "#ffb690", "primary-fixed": "#ffdbca", "surface-tint": "#9d4300", "tertiary-container": "#a09a91", "danger-bg": "#FEF2F2", "success-bg": "#F0FDF4", "surface-variant": "#e4e2e1", "on-error-container": "#93000a", "outline-variant": "#e0c0b1", "primary-fixed-dim": "#ffb690", "warning": "#D97706", "tertiary-fixed-dim": "#ccc5bc", "outline": "#8c7164", "secondary": "#a73a00", "surface-container-low": "#f6f3f2", "surface": "#F5F5F5", "surface-container-highest": "#e4e2e1", "border": "#E5E7EB", "on-tertiary-fixed": "#1e1b15", "error": "#ba1a1a", "on-secondary": "#ffffff", "background": "#fcf9f8", "surface-dim": "#dcd9d9", "violet-bg": "#F5F3FF", "secondary-container": "#fd651e", "on-primary-fixed-variant": "#783200", "primary-container": "#f97316", "secondary-fixed": "#ffdbce", "surface-container-lowest": "#ffffff", "surface-container-high": "#eae7e7", "info-bg": "#F0F9FF" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-lg": "1.5rem", "space-sm": "0.5rem", "gutter": "1rem", "space-md": "1rem", "space-xs": "0.25rem", "space-xl": "2rem", "margin": "1rem" }, "fontFamily": { "body-md": ["Inter"], "code-sm": ["JetBrains Mono"], "display": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "body-sm": ["Inter"], "headline-lg": ["Plus Jakarta Sans"], "caption": ["Inter"], "label-md": ["Inter"], "headline-md": ["Plus Jakarta Sans"] }, "fontSize": { "body-md": ["15px", { "lineHeight": "24px", "fontWeight": "400" }], "code-sm": ["13px", { "lineHeight": "18px", "fontWeight": "500" }], "display": ["28px", { "lineHeight": "36px", "fontWeight": "800" }], "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }], "body-sm": ["13px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }], "caption": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "600" }], "label-md": ["13px", { "lineHeight": "20px", "fontWeight": "600" }], "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface-white font-body-md text-body-md text-on-surface flex flex-col min-h-screen"><main class="flex flex-col flex-1 w-full bg-surface-white pt-safe pb-safe"><div class="flex flex-col w-full px-margin pb-space-lg select-none">
<!-- Top Branding Header -->
<header class="flex flex-col items-center pt-space-md pb-space-md text-center">
<div class="relative w-14 h-14 rounded-xl overflow-hidden shadow-sm bg-surface-container flex items-center justify-center">
<img alt="Lendora App Icon" class="w-14 h-14 object-cover rounded-xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZevOIzlg4pK9TcWg7rmiTEYvTxHxD29qqBCWi4It6PrIMkM2Q_S9kUmqjouUGkLx67_NtvXgDuSC53C1qqK3ZsWBkvk5gXnFlLwID0bVYnlqMwX6gC0ZxvH1LR7Tc3gUl0hMzrQAPgGO5ugcgn4Gzh216Mo3sBrB_AIZ-9nmR3-km9c0ic2lzt4sfCHp_8tyLJQVMwD1ydFrJ4MT0lorAjOWAQZnvvLfmXw188Hbgmkdn0hvM1gveAw"/>
</div>
<div class="flex items-center gap-space-xs mt-3">
<h1 class="font-headline-lg text-primary-container tracking-tight text-[26px] font-bold">Lendora</h1>
<span class="bg-primary-fixed text-on-primary-fixed font-caption text-[11px] px-2 py-0.5 rounded-full font-semibold">
        Campus Gear
      </span>
</div>
<!-- Friendly Welcoming Statement -->
<h2 class="font-headline-lg text-on-surface text-[24px] font-bold mt-5 tracking-tight">
      Selamat datang kembali
    </h2>
<p class="font-body-md text-text-muted text-[14px] leading-relaxed max-w-[320px] mt-1 text-center">
      Masuk untuk mengajukan peminjaman peralatan laboratorium &amp; multimedia
    </p>
</header>
<!-- Login Form Container -->
<div class="w-full mt-2">
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); handleFormSubmit();">
<!-- Input Field: Email Kampus -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-on-surface text-[13px] font-semibold flex items-center gap-1" for="campusEmail">
<span>Email Kampus</span>
<span class="text-danger font-bold">*</span>
</label>
<div class="relative flex items-center w-full bg-surface-white rounded-lg shadow-sm">
<div class="absolute left-3 flex items-center pointer-events-none text-text-muted">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input autocomplete="email" class="w-full h-11 pl-10 pr-3 rounded-lg bg-surface-white text-on-surface font-body-md text-[14px] placeholder:text-text-muted outline-none focus:bg-surface-container-low transition-colors" id="campusEmail" name="email" placeholder="nama@mahasiswa.kampus.ac.id" required="" type="email"/>
</div>
</div>
<!-- Input Field: Kata Sandi -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-on-surface text-[13px] font-semibold flex items-center gap-1" for="passwordInput">
<span>Kata Sandi</span>
<span class="text-danger font-bold">*</span>
</label>
<div class="relative flex items-center w-full bg-surface-white rounded-lg shadow-sm">
<div class="absolute left-3 flex items-center pointer-events-none text-text-muted">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="w-full h-11 pl-10 pr-11 rounded-lg bg-surface-white text-on-surface font-body-md text-[14px] placeholder:text-text-muted outline-none focus:bg-surface-container-low transition-colors" id="passwordInput" name="password" placeholder="Masukkan kata sandi" required="" type="password"/>
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute right-1 w-9 h-9 flex items-center justify-center text-text-muted hover:text-on-surface transition-colors rounded-lg active:scale-95" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwdEyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password Links -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<div class="relative flex items-center">
<input class="sr-only peer" id="rememberMe" name="remember" type="checkbox"/>
<div class="w-5 h-5 bg-surface-white rounded flex items-center justify-center peer-checked:bg-primary-container peer-focus:scale-105 shadow-sm transition-all">
<span class="material-symbols-outlined text-surface-white text-[16px] opacity-0 peer-checked:opacity-100 font-bold transition-opacity">check</span>
</div>
</div>
<span class="font-label-md text-text-muted text-[13px] leading-none">Ingat saya</span>
</label>
<button class="font-label-md text-primary-container text-[13px] font-semibold hover:underline active:opacity-80 transition-opacity" onclick="triggerForgotPassword()" type="button">
          Lupa kata sandi?
        </button>
</div>
<!-- Primary Action Button -->
<div class="pt-2">
<button class="w-full h-12 bg-primary-container active:bg-secondary text-surface-white font-headline-sm text-[15px] font-semibold rounded-lg flex items-center justify-center gap-2 shadow-sm transition-all active:scale-[0.99]" id="submitButton" type="submit">
<span>Masuk</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Register Redirection Section -->
<div class="flex items-center justify-center gap-1.5 mt-6 py-2 text-center">
<span class="font-body-sm text-text-muted text-[13px]">Belum punya akun?</span>
<button class="font-label-md text-primary-container text-[13px] font-semibold hover:underline active:opacity-80 transition-opacity" onclick="handleGoToRegister()" type="button">
      Daftar Akun Baru
    </button>
</div>
<!-- Campus Trust & Security Card -->
<div class="w-full mt-6 bg-surface-container-low rounded-xl p-3.5 flex items-center gap-3">
<div class="w-9 h-9 rounded-lg bg-surface-container flex-shrink-0 flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
</div>
<div class="flex flex-col min-w-0">
<p class="font-caption text-on-surface text-[12px] font-semibold leading-tight">
        Akses Terverifikasi
      </p>
<p class="font-body-sm text-text-muted text-[11px] leading-snug mt-0.5">
        Khusus mahasiswa, asisten lab &amp; staf kampus terdaftar.
      </p>
</div>
</div>
<!-- Quick Info / Help Section -->
<div class="flex items-center justify-center gap-4 mt-6 text-center text-text-muted font-body-sm text-[12px]">
<button class="hover:text-on-surface transition-colors flex items-center gap-1" onclick="showHelpToast('Panduan Peminjaman')" type="button">
<span class="material-symbols-outlined text-[14px]">menu_book</span>
<span>Tata Tertib Lab</span>
</button>
<span class="inline-block w-1 h-1 rounded-full bg-surface-container-high"></span>
<button class="hover:text-on-surface transition-colors flex items-center gap-1" onclick="showHelpToast('Bantuan Teknis')" type="button">
<span class="material-symbols-outlined text-[14px]">contact_support</span>
<span>Bantuan Admin</span>
</button>
</div>
<!-- Versioning & Legal Watermark -->
<div class="w-full text-center mt-6 pt-2 pb-1">
<span class="font-code-sm text-text-muted text-[11px] tracking-wide">
      Lendora V3 · v1.0.0
    </span>
</div>
<!-- Interactive Feedback Notification Toast (Hidden by default) -->
<div class="fixed bottom-6 left-4 right-4 max-w-[448px] mx-auto bg-surface-white text-on-surface p-3.5 rounded-xl shadow-xl flex items-center gap-3 transform translate-y-24 opacity-0 pointer-events-none transition-all duration-300 z-50" id="interactionToast">
<div class="w-8 h-8 rounded-full bg-success-bg text-success flex items-center justify-center flex-shrink-0" id="toastIconContainer">
<span class="material-symbols-outlined text-[18px]" id="toastIcon">info</span>
</div>
<div class="flex flex-col flex-1 min-w-0">
<span class="font-headline-sm text-[13px] font-semibold leading-none truncate text-on-surface" id="toastTitle">Pemberitahuan</span>
<span class="font-body-sm text-[12px] text-text-muted leading-tight mt-1 truncate" id="toastMessage">Detail aksi</span>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('pwdEyeIcon');
    if (!pwdInput || !eyeIcon) return;
    
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeIcon.innerText = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      eyeIcon.innerText = 'visibility';
    }
  }

  function showInteractiveNotification(title, message, isError = false) {
    const toast = document.getElementById('interactionToast');
    const toastTitle = document.getElementById('toastTitle');
    const toastMessage = document.getElementById('toastMessage');
    const toastIcon = document.getElementById('toastIcon');
    const toastIconContainer = document.getElementById('toastIconContainer');
    
    if (!toast || !toastTitle || !toastMessage) return;

    toastTitle.innerText = title;
    toastMessage.innerText = message;

    if (isError) {
      toastIconContainer.className = "w-8 h-8 rounded-full bg-danger-bg text-danger flex items-center justify-center flex-shrink-0";
      toastIcon.innerText = "error";
    } else {
      toastIconContainer.className = "w-8 h-8 rounded-full bg-success-bg text-success flex items-center justify-center flex-shrink-0";
      toastIcon.innerText = "check_circle";
    }

    toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
    toast.classList.add('translate-y-0', 'opacity-100');

    if (window.toastTimeout) clearTimeout(window.toastTimeout);
    window.toastTimeout = setTimeout(() => {
      toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
      toast.classList.remove('translate-y-0', 'opacity-100');
    }, 3500);
  }

  function handleFormSubmit() {
    const email = document.getElementById('campusEmail').value;
    const pwd = document.getElementById('passwordInput').value;
    const submitBtn = document.getElementById('submitButton');

    if (!email || !pwd) {
      showInteractiveNotification('Form Belum Lengkap', 'Silakan isi email dan kata sandi Anda.', true);
      return;
    }

    submitBtn.disabled = true;
    submitBtn.classList.add('opacity-75');
    submitBtn.innerHTML = `
      <span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
      <span>Memverifikasi...</span>
    `;

    setTimeout(() => {
      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-75');
      submitBtn.innerHTML = `
        <span>Masuk</span>
        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
      `;
      showInteractiveNotification('Verifikasi Berhasil', 'Selamat datang di Katalog Peminjaman Lendora!');
    }, 1200);
  }

  function triggerForgotPassword() {
    showInteractiveNotification('Reset Kata Sandi', 'Tautan pemulihan akan dikirimkan ke email kampus.');
  }

  function handleGoToRegister() {
    showInteractiveNotification('Pendaftaran Akun', 'Mengarahkan ke formulir registrasi mahasiswa baru...');
  }

  function showHelpToast(category) {
    showInteractiveNotification(category, 'Pusat bantuan laboratorium siap melayani via portal kampus.');
  }
</script></main></body></html>
